<!doctype html>
<meta charset="utf-8">
<title>Rig check — skin, joints and soft tissue</title>
<!--
  Open this in a browser from a local server (a file:// page cannot read the
  sprite back, and reading it back is how the rig cuts the pet up):

      python3 -m http.server        then  http://localhost:8000/tools/rig_check.html

  It changes nothing on disk. Add ?pet=1 to check character 2.

  What it is for: the rig draws each limb through a GRID whose corners are
  shared between bones, and hangs soft tissue off that grid. Both are invisible
  when they work. This page makes them visible, and puts the pet through more
  abuse in ten seconds than a user will manage in a week.
-->
<style>
  body { margin: 0; background: #14161c; color: #cfd6e4;
         font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  header { padding: 14px 18px; border-bottom: 1px solid #262b36; }
  h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; color: #fff; }
  .hint { color: #7d879b; }
  .bar { display: flex; flex-wrap: wrap; gap: 16px; padding: 12px 18px;
         border-bottom: 1px solid #262b36; align-items: center; }
  label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  canvas { display: block; background: #fff; }
  .wrap { display: flex; flex-wrap: wrap; gap: 18px; padding: 18px; }
  figure { margin: 0; }
  figcaption { padding: 6px 2px; color: #9aa4b8; }
  table { border-collapse: collapse; margin: 4px 18px 24px; }
  th, td { text-align: left; padding: 4px 16px 4px 0; }
  th { color: #7d879b; font-weight: 400; }
  .bad { color: #ff7676; }
  .good { color: #5fd08a; }
  button { font: inherit; background: #2a3040; color: #cfd6e4;
           border: 1px solid #3a4356; border-radius: 5px; padding: 5px 12px; cursor: pointer; }
</style>

<header>
  <h1>Rig check</h1>
  <div class="hint">The four poses below are the ones that break a rig: standing,
    folded, thrown, and landed. Look for a joint that scissors, a limb that
    stretches, or a seam that opens.</div>
</header>

<div class="bar">
  <label><input type="checkbox" id="mesh" checked> skinned grid</label>
  <label><input type="checkbox" id="wire"> show the grid + soft tissue</label>
  <label>grid spacing <input type="range" id="cell" min="18" max="64" value="30" step="2">
    <span id="cellv">30</span></label>
  <button id="stress">Run the stress test</button>
  <span id="status" class="hint"></span>
</div>

<div class="wrap" id="shots"></div>
<table id="report"></table>

<script src="../pet_rig_config.js"></script>
<script src="../pet_rig.js"></script>
<script>
(() => {
  const petIndex = /pet=1/.test(location.search) ? 1 : 0;
  const shots = document.getElementById('shots');
  const report = document.getElementById('report');
  const status = document.getElementById('status');
  const W = 320, H = 400;

  // Character 2 may have its own sprite or may be character 1 tinted, depending
  // on the app — try the one and fall back to the other.
  const base = new Image();
  base.onerror = () => {
    if (base.src.indexOf('base_2') >= 0) { base.src = '../images/base.png'; return; }
    status.textContent = 'images/base.png did not load';
  };
  base.src = '../images/' + (petIndex ? 'base_2.png' : 'base.png');

  // A fresh rig each time, so a setting change is a clean rebuild rather than
  // a half-updated one.
  function makeRig() {
    window.PET_RIG.mesh = Object.assign({}, window.PET_RIG.mesh, {
      enabled: document.getElementById('mesh').checked,
      cell: +document.getElementById('cell').value,
    });
    window.PetRig.resetGeometry();
    const rig = window.PetRig.create({ petIndex });
    rig.setBase(base);
    rig.setDebug(document.getElementById('wire').checked);
    return rig;
  }

  function stateFor(rig, over) {
    const scale = (H - 30) / rig.srcH;
    return Object.assign({
      petX: W / 2 - rig.srcW * scale / 2, petY: 10,
      originX: 0, originY: 0, scale,
      floorY: 10 + rig.footY * scale,
      poseK: rig.pose.idle, pin: null, airborne: false,
    }, over || {});
  }

  // Each pose is a little script: what to do to the pet, for how long.
  const POSES = [
    { name: 'standing', frames: 40, run: () => {} },
    { name: 'folded — one hand pinned across the chest', frames: 140,
      run: (rig, S) => { S.poseK = rig.pose.heldLimb; S.pin = { joint: 'handL', x: S.petX + 260, y: 90 }; } },
    { name: 'thrown — body yanked about, limbs left behind', frames: 44,
      run: (rig, S, i) => { S.poseK = rig.pose.airborne; S.airborne = true;
                            S.petX = W / 2 - rig.srcW * S.scale / 2 + Math.sin(i / 4) * 90; } },
    { name: 'landed — the flesh keeps going', frames: 14,
      run: (rig, S, i) => { if (i === 0) rig.kick(1); } },
  ];

  function render() {
    if (!base.complete || !base.naturalWidth) return;
    shots.innerHTML = '';
    report.innerHTML = '';
    const rig = makeRig();
    if (!rig.ready) { status.textContent = 'the rig could not cut the sprite up — is this page being served over http?'; return; }
    status.textContent = '';

    for (const pose of POSES) {
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');
      const S = stateFor(rig);
      if (pose.name === 'standing') { rig.placeRest(S); rig.snap(); }
      for (let i = 0; i < pose.frames; i++) { pose.run(rig, S, i); rig.step(1 / 60, S); }
      rig.draw(ctx, S);
      const fig = document.createElement('figure');
      fig.appendChild(cv);
      const cap = document.createElement('figcaption');
      cap.textContent = pose.name;
      fig.appendChild(cap);
      shots.appendChild(fig);
    }

    const m = rig._meshDebug();
    row('grid', m.quads + ' quads, ' + m.verts + ' corners, ' + m.tris + ' triangles a frame');
  }

  function row(k, v, cls) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<th>' + k + '</th><td class="' + (cls || '') + '">' + v + '</td>';
    report.appendChild(tr);
  }

  // ---- The stress test ----------------------------------------------------
  // Four thousand frames of the pet being thrown, dragged by a random limb and
  // dropped. Nothing here is a picture: it is the three ways a ragdoll fails.
  //
  //   NaN          a point that has left the number line. Always a bug.
  //   stretch      the worst a bone got, as a fraction of its rest length. A
  //                little is the body leaning into a pull; a lot is a tear.
  //   legs crossed frames where the left knee ended up right of the right one.
  //                Distances cannot tell left from right, so without something
  //                that can, a hard landing mirrors the pelvis and stays that
  //                way forever. Must be 0.
  function stress() {
    status.textContent = 'running…';
    setTimeout(() => {
      const rig = makeRig();
      if (!rig.ready) { status.textContent = 'rig not ready'; return; }
      const G = window.PetRig.geometry(rig.poseName), P = rig.points;
      const S = stateFor(rig, { poseK: rig.pose.airborne, airborne: true });
      rig.placeRest(S); rig.snap();
      let seed = 12345;
      const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
      let nan = 0, stretch = 0, worst = '', crossed = 0;
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');
      const t0 = performance.now();
      const N = 4000;
      for (let i = 0; i < N; i++) {
        S.petX = W / 2 + Math.sin(i / 7) * 110 + (rnd() - 0.5) * 40;
        S.petY = 10 + Math.sin(i / 11) * 70;
        const m = i % 400;
        S.poseK = m < 200 ? rig.pose.airborne : rig.pose.idle;
        S.pin = (m > 250 && m < 330)
          ? { joint: ['handL', 'handR', 'footL', 'footR'][i % 4], x: rnd() * W, y: rnd() * H } : null;
        if (m === 200) rig.kick(1);
        rig.step(1 / 60, S);
        ctx.clearRect(0, 0, W, H);
        rig.draw(ctx, S);
        for (const k in P) if (!isFinite(P[k].x) || !isFinite(P[k].y)) nan++;
        for (const b of G.bones) {
          const A = P[b.def.a], B = P[b.def.b];
          const e = Math.abs(Math.hypot(B.x - A.x, B.y - A.y) / (b.len * S.scale) - 1);
          if (e > stretch) { stretch = e; worst = b.id; }
        }
        let ux = P.hipR.x - P.hipL.x, uy = P.hipR.y - P.hipL.y;
        const n = Math.hypot(ux, uy) || 1;
        if ((ux * (P.kneeR.x - P.kneeL.x) + uy * (P.kneeR.y - P.kneeL.y)) / n < 0) crossed++;
      }
      const ms = (performance.now() - t0) / N;
      report.innerHTML = '';
      const m2 = rig._meshDebug();
      row('grid', m2.quads + ' quads, ' + m2.tris + ' triangles a frame');
      row('step + draw', ms.toFixed(2) + ' ms a frame', ms < 4 ? 'good' : 'bad');
      row('NaN', nan, nan ? 'bad' : 'good');
      row('worst stretch', (stretch * 100).toFixed(0) + '% on ' + worst, stretch > 1 ? 'bad' : '');
      row('legs crossed', crossed + ' / ' + N + ' frames', crossed ? 'bad' : 'good');
      status.textContent = '';
    }, 20);
  }

  base.onload = render;
  for (const id of ['mesh', 'wire']) document.getElementById(id).onchange = render;
  document.getElementById('cell').oninput = (e) => {
    document.getElementById('cellv').textContent = e.target.value;
    render();
  };
  document.getElementById('stress').onclick = stress;
})();
</script>
